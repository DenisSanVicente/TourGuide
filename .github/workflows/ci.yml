name: TourGuide CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TourGuide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: TourGuide/pom.xml

      - name: Install GpsUtil
        run: |
          mvn install:install-file \
            -Dfile=libs/gpsUtil.jar \
            -DgroupId=gpsUtil \
            -DartifactId=gpsUtil \
            -Dversion=1.0.0 \
            -Dpackaging=jar

      - name: Install TripPricer
        run: |
          mvn install:install-file \
            -Dfile=libs/TripPricer.jar \
            -DgroupId=tripPricer \
            -DartifactId=tripPricer \
            -Dversion=1.0.0 \
            -Dpackaging=jar

      - name: Install RewardCentral
        run: |
          mvn install:install-file \
            -Dfile=libs/RewardCentral.jar \
            -DgroupId=rewardCentral \
            -DartifactId=rewardCentral \
            -Dversion=1.0.0 \
            -Dpackaging=jar

      - name: Compile
        run: mvn compile

      - name: Test
        run: mvn test

      - name: Build artifact
        run: mvn package -DskipTests
